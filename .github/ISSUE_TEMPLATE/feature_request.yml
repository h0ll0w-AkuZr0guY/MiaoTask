name: 功能建议
description: 讨论使用场景、适配需求或结构改进。
title: 'feat(模块): 简述希望支持的行为'
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有建议，一个 Issue 聚焦一个场景。无需先写代码或提供账号、设备地址。
        新应用、设备或公共组件建议可先参考 [架构](https://github.com/h0ll0w-AkuZr0guY/MiaoTask/blob/main/docs/ARCHITECTURE.md) 与 [公共接口](https://github.com/h0ll0w-AkuZr0guY/MiaoTask/blob/main/docs/REUSABLE_INTERFACES.md)。
  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前检查
      options:
        - label: 已搜索相关 Issue，未提供个人、账号或设备敏感信息。
          required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前困难
      description: 谁在什么情况下需要这个功能？现有流程哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为与范围
      description: 描述可观察的结果；如涉及新应用或设备，写明类别及希望覆盖的操作。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充材料（可选）
      description: 可以说明现有替代方法、兼容限制或已有组件的复用思路；附图请先脱敏。

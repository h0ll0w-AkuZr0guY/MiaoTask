name: Build macOS Apple Silicon portable release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Verify reviewed release notes
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("version.json"))["version"])')
          python scripts/prepare_release.py --ready
          if grep -Eq '^\* 【' docs/UNRELEASED.md; then
            echo 'Prepare and review the release notes before building' >&2
            exit 1
          fi
          python scripts/release_notes.py "$version" --output "$RUNNER_TEMP/miao-release-notes.md"
      - name: Audit public source files
        run: python scripts/check_public_files.py
      - name: Install build environment
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Fetch official macOS ADB runtime
        run: python scripts/fetch_platform_tools.py
      - name: Test, build, and verify the portable package
        run: python scripts/package_macos.py --adb-dir build/vendor/platform-tools --preinstall-all
      - uses: actions/upload-artifact@v4
        with:
          name: MiaoTask-macos-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

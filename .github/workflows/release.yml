name: Build Windows portable release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - name: Verify reviewed release notes
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath version.json -Raw | ConvertFrom-Json).version
          python scripts/prepare_release.py --ready
          if ($LASTEXITCODE -ne 0) { throw 'Invalid pending contribution format' }
          $pending = Get-Content -LiteralPath docs/UNRELEASED.md -Raw
          if ($pending -match '(?m)^\* 【') { throw 'Prepare and review the release notes before building' }
          python scripts/release_notes.py $version --output "$env:RUNNER_TEMP/miao-release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed release notes are required' }
      - name: Audit public source files
        run: python scripts/check_public_files.py
      - name: Install locked build environment
        run: python -m pip install -r requirements-windows.lock
      - name: Fetch official ADB runtime
        run: python scripts/fetch_platform_tools.py
      - name: Test, build, and verify the portable package
        run: python scripts/package_windows.py --adb-dir build/vendor/platform-tools --preinstall-activity taobao/double11
      - uses: actions/upload-artifact@v7
        with:
          name: MiaoTask-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

name: Check pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-windows.lock
      - name: Validate a dispatched release preparation
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/release-prepare-')
        run: python scripts/prepare_release.py --ready
      - name: Protect release records and suggest PR context
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: python scripts/check_contribution.py --event "$env:GITHUB_EVENT_PATH" --advisory-metadata
      - name: Check public source, regressions and syntax
        run: python scripts/check_project.py

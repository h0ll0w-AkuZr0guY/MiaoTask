name: Publish verified release assets

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      source_ref:
        type: string
        required: true
      build_run_id:
        type: string
        required: true
      confirm:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed version to publish, e.g. MiaoTask-v0.1.0
        required: true
      source_ref:
        description: Exact reviewed build commit SHA
        required: true
      confirm:
        description: Publish this reviewed build publicly
        type: boolean
        default: false
      build_run_id:
        description: Successful Build macOS Apple Silicon portable release run ID
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm
    environment: release
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and publish the exact tag's build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Provide the full reviewed commit SHA' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^MiaoTask-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid tag' >&2; exit 1; }
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid build run ID' >&2; exit 1; }
          revision=$(git rev-parse HEAD)
          version=$(python -c 'import json; print(json.load(open("version.json"))["version"])')
          [[ "$version" == "$RELEASE_TAG" ]] || { echo 'Version must match reviewed source' >&2; exit 1; }
          if existing_tag=$(git rev-parse --verify "${RELEASE_TAG}^{commit}" 2>/dev/null); then
            [[ "$existing_tag" == "$revision" ]] || { echo 'Existing tag points to different source' >&2; exit 1; }
          fi
          gh run download "$BUILD_RUN_ID" --name MiaoTask-macos-arm64 --dir release-assets
          zip_path="release-assets/${RELEASE_TAG}-macos-arm64.zip"
          sum_path="${zip_path}.sha256"
          expected_hash=$(awk '{print $1}' "$sum_path")
          actual_hash=$(shasum -a 256 "$zip_path" | awk '{print $1}')
          [[ "$expected_hash" == "$actual_hash" ]] || { echo 'Artifact checksum mismatch' >&2; exit 1; }
          python - "$zip_path" "$revision" "$RELEASE_TAG" <<'PY'
          import json, sys, zipfile
          zip_path, revision, tag = sys.argv[1:4]
          with zipfile.ZipFile(zip_path) as zf:
              manifest = json.loads(zf.read('MiaoTask/build-manifest.json'))
          if (manifest.get('preview') or manifest.get('source_dirty')
                  or manifest.get('source_commit') != revision
                  or manifest.get('version') != tag
                  or manifest.get('platform') != 'macos-arm64'
                  or not manifest.get('smoke_test_passed')):
              raise SystemExit('Portable package provenance mismatch')
          PY
          public_notes="$RUNNER_TEMP/miao-release-notes.md"
          python scripts/release_notes.py "$RELEASE_TAG" --output "$public_notes"
          if release_json=$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null); then
            is_draft=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["isDraft"])' "$release_json")
            [[ "$is_draft" == "True" ]] || { echo 'Release already published; preserving its assets' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" "$zip_path" "$sum_path" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$public_notes"
          else
            title="${RELEASE_TAG/MiaoTask-/MiaoTask }"
            gh release create "$RELEASE_TAG" "$zip_path" "$sum_path" --target "$revision" --latest --title "$title" --notes-file "$public_notes"
          fi
          gh release view "$RELEASE_TAG" --json url,isDraft,assets

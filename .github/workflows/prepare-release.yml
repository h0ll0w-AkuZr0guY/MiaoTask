name: Prepare release for review

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example MiaoTask-v0.1.0
        required: true
      summary:
        description: Short release summary
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Summarize pending contributions in a review branch
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SUMMARY: ${{ inputs.summary }}
          BASE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/prepare_release.py --version "$RELEASE_VERSION" --summary "$RELEASE_SUMMARY"
          branch="codex/release-prepare-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/UNRELEASED.md docs/RELEASES.md version.json .github/release-plan.json
          git commit -m "chore(release): prepare $RELEASE_VERSION"
          git diff HEAD^ HEAD --output=release-preparation.patch
          git push origin "$branch"
          body_path="$RUNNER_TEMP/release-pr.md"
          cat > "$body_path" <<'EOF'
          汇总 docs/UNRELEASED.md 到统一发布记录并清空待发布区。请审阅措辞、版本和范围后合并。

          ## 问题与结果
          本 PR 仅准备发布记录、版本与明确发布标记，不执行打包。合并到 main 后自动测试并构建 macOS Apple Silicon ZIP，公开发布前在 release 环境等待维护者确认。

          ## 影响与兼容
          仅收录已合并贡献。若 main 新增贡献，请更新本准备 PR；普通功能 PR 不会触发发布。

          ## 实际验证
          PR CI 验证准备文件，合并后重新运行完整回归、macOS Apple Silicon 便携包构建及自检。
          EOF
          gh pr create --base "$BASE_BRANCH" --head "$branch" --title "chore(release): prepare $RELEASE_VERSION" --body-file "$body_path"
          gh workflow run ci.yml --ref "$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-preparation
          path: release-preparation.patch
          if-no-files-found: ignore

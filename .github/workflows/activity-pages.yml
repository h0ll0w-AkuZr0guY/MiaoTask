name: Publish activity resources to Pages
on:
  push:
    branches: [main]
    paths: ['backend/app/**', 'frontend/**', 'scripts/site-preview/**', 'docs/assets/demo-phone.svg', 'version.json', 'scripts/build_preview_site.py', 'scripts/build_activity_site.py', 'scripts/package_activities.py', '.github/workflows/activity-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: activity-pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.MIAOTASK_ACTIVITY_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/build_activity_site.py --output _site/activities
      - run: python scripts/build_preview_site.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
